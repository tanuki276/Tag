name: Simulation Engine

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Run
        run: python main.py

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Video
        run: |
          ffmpeg -framerate 10 -i frames/frame_%03d.png -c:v libx264 -pix_fmt yuv420p -y result.mp4
          rm -rf frames

      - name: Upload Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-video
          path: result.mp4
          if-no-files-found: warn
